name: CI

on:
  pull_request:
  push:
    branches: [ deployment/free-hosting ]
defaults:
  run:
    working-directory: backend

jobs:
  scan_ruby:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
          bundler-cache: true
          working-directory: backend

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
          bundler-cache: true
          working-directory: backend

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('backend/.ruby-version', 'backend/**/.rubocop.yml', 'backend/**/.rubocop_todo.yml', 'backend/Gemfile.lock') }}
        with:
          path: backend/tmp/rubocop
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
          bundler-cache: true
          working-directory: backend
      - name: Run tests
        env:
          RAILS_ENV: test
          BACKEND_DATABASE_HOST: localhost
          BACKEND_DATABASE_USERNAME: postgres
          BACKEND_DATABASE_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY_BASE: test-secret-key-base-for-ci-only-not-production
        run: bin/rails db:test:prepare test

  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    needs: [scan_ruby, lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/deployment/free-hosting'
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build production Docker image
        run: |
          docker build --pull -t url_shortner-web:latest ./backend
          docker save url_shortner-web:latest | gzip > url_shortner-web.tar.gz

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer Docker image to Oracle VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            url_shortner-web.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/url_shortner-web.tar.gz"

      - name: Deploy application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/ubuntu/url_shortner

          # Update deployment configuration from GitHub.
          git pull --ff-only origin deployment/free-hosting

          docker load -i /tmp/url_shortner-web.tar.gz

          # Update Rails server and apply pending database migrations.
          docker compose up -d --no-deps web

          # Refresh Nginx DNS resolution for the new web container.
          docker compose restart nginx

          # Verify the application before restarting Sidekiq.
          for attempt in $(seq 1 30); do
            if curl -fsS "${{ secrets.DEPLOY_HEALTH_URL }}" >/dev/null; then
              echo "Backend health check passed."
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "Backend health check failed."
              exit 1
            fi

            sleep 5
          done

          # Update Sidekiq only after the web application is healthy.
          docker compose up -d --no-deps worker

          # Back up the successfully deployed Docker image to OCI.
          ./backup-image.sh

          rm -f /tmp/url_shortner-web.tar.gz

          echo "Deployment completed successfully."
          REMOTE

      - name: Clean up SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
