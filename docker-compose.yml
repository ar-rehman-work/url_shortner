services:
  web:
    image: url_shortner-web:latest
    command: ["./bin/rails", "server"]
    env_file: .env
    environment:
      RAILS_ENV: production
      PORT: 3000
      BACKEND_DATABASE_HOST: db
      REDIS_URL: redis://redis:6379/1
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-1}
      BACKEND_DATABASE_USERNAME: ${BACKEND_DATABASE_USERNAME}
      BACKEND_DATABASE_PASSWORD: ${BACKEND_DATABASE_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  worker:
    image: url_shortner-web:latest
    command: ["bundle", "exec", "sidekiq", "-c", "${SIDEKIQ_CONCURRENCY:-1}"]
    env_file: .env
    environment:
      RAILS_ENV: production
      BACKEND_DATABASE_HOST: db
      REDIS_URL: redis://redis:6379/1
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-1}
      BACKEND_DATABASE_USERNAME: ${BACKEND_DATABASE_USERNAME}
      BACKEND_DATABASE_PASSWORD: ${BACKEND_DATABASE_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
    env_file: .env
    environment:
      POSTGRES_DB: url_shortner_production
      POSTGRES_USER: ${BACKEND_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${BACKEND_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
